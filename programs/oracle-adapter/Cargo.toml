# SPDX-License-Identifier: Apache-2.0
[package]
name = "oracle-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Normalizes a price source into a validated quote for settlement."

[lib]
crate-type = ["cdylib", "lib"]
name = "oracle_adapter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "common/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
common = { workspace = true }
# `pyth-solana-receiver-sdk` is deliberately not a dependency; see the docs on
# `src/pyth.rs` for why, and for the golden vectors that stand in for it.
