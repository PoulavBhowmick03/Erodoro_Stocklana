# SPDX-License-Identifier: Apache-2.0
[package]
name = "series"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Covered-call vault and settlement engine for a tokenized equity."

[lib]
crate-type = ["cdylib", "lib"]
name = "series"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "common/idl-build",
]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true, features = ["token_2022", "token_2022_extensions"] }
common = { workspace = true }
oracle-adapter = { workspace = true }
# `no-entrypoint` is required: spl-token-2022 is itself a deployable program and
# ships a `#[global_allocator]` plus an entrypoint. Linking it as a library
# without this collides with the allocator of whichever program depends on it.
spl-token-2022 = { version = "8.0", features = ["no-entrypoint"] }
