# SPDX-License-Identifier: Apache-2.0
#
# Pinocchio variant of `series`. An independent workspace, like its three
# siblings, so it can carry its own dependency set and profile.
#
# This one is different in a way worth stating at the top: it **links the money
# math rather than reimplementing it**.
#
# `common/src/math.rs` is 714 lines with zero references to Anchor -- the
# settlement partition, the redeem pro-rata, the shortfall haircut, the strike
# adjustment. The other three ports rewrote their logic and proved equivalence
# with differential tests. Doing that here would buy nothing and would risk the
# one class of bug differential fuzzing is weakest against: both sides wrong in
# the same way, because one was written by reading the other. Linking makes the
# arithmetic identical by construction.
#
# The fear was that `common`'s error enum is an Anchor `#[error_code]`, so
# `anchor-lang` would come along and cost ~10 KB / 0.07 SOL. That was measured
# and is false: taking `common` with `default-features = false` produced a
# byte-identical binary (126,128 B both ways), because nothing in this crate
# calls into the code `#[error_code]` generates and both LTO and the linker drop
# it. The dependency stays on the default feature because the enum it brings is
# the same one the conformance suite compares against Anchor's own conversion.
[workspace]

[package]
name = "series-pinocchio"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# The `tests/` suite is compiled into the crate (see `src/lib.rs`), because the
# deploy artifact is `cdylib`-only and cargo builds no rlib for it to link.
autotests = false

[lib]
# A real entrypoint now: this builds the deployable program.
#
# `cdylib` **alone**. Cargo only enables `lto` for a unit whose crate types can
# all be linked with it, and an `lib`/rlib cannot, so the previous
# `["cdylib", "lib"]` silently turned `lto = "fat"` below into a no-op: the
# `-C lto=fat` never reached rustc. Dropping the rlib lets LTO actually run,
# which is worth 18,112 bytes (0.126 SOL) on this program alone.
#
# The cost is that cargo no longer builds an rlib for the `tests/` suite to link
# against. `autotests = false` in `[package]` plus the `#[path]` include block
# in `src/lib.rs` compiles that suite into the crate instead.
crate-type = ["cdylib"]

[features]
no-entrypoint = []

[dependencies]
pinocchio = "0.11.2"
pinocchio-pubkey = "0.3.0"
pinocchio-system = "0.6.1"
solana-address = { version = "2.7", features = ["syscalls"] }
# The arithmetic, not a copy of it.
common = { path = "../../common" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"

[dev-dependencies]
anchor-lang = "0.31.1"
# Linked so the conformance tests can drive both implementations through the
# same inputs rather than comparing against transcribed constants.
series = { path = "../../programs/series", features = ["no-entrypoint"] }
proptest = "1.11.0"
pinocchio = "0.11.2"
sha2 = "0.11.0"
solana-address = { version = "2.7", features = ["curve25519"] }
# Reference builders for the transfer differential suite. Host-only; none of
# these link into the program.
spl-token-2022 = { version = "8", features = ["no-entrypoint"] }
spl-transfer-hook-interface = "0.10"
spl-tlv-account-resolution = "0.10"
solana-account-info = "2.2"
solana-pubkey = { version = "2.2", features = ["curve25519"] }
solana-instruction = "2.2"
solana-program-error = "3"
solana-program-pack = "2"
spl-token = "7"
spl-associated-token-account-client = "2"
spl-associated-token-account = "6"
oracle-adapter = { path = "../../programs/oracle-adapter", features = ["no-entrypoint"] }
serde_json = "1"
base64 = "0.21"
