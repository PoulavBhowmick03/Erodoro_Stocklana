# SPDX-License-Identifier: Apache-2.0
#
# Pinocchio variant of `factory`, kept as an independent workspace so it can
# carry its own dependency set and profile -- the same arrangement as
# `oracle-adapter-pinocchio`, and for the same reason: deploy rent is
# `(bytes + 173) * 6960` lamports and nothing else, so the framework is a
# measurable line item.
#
# `factory` is the second port rather than the first because it holds no
# collateral, has the thinnest logic of the four (588 lines), and carries the
# highest share of Anchor-generated weight -- 37.2% of its symbol bytes against
# 0.7% for SPL. What it does have that `oracle-adapter` did not is a CPI into
# another Anchor program, which has to be re-encoded by hand.
[workspace]

[package]
name = "factory-pinocchio"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# The `tests/` suite is compiled into the crate (see `src/lib.rs`).
autotests = false

[lib]
# `cdylib` **alone**. Cargo only enables `lto` for a unit whose crate types can
# all be linked with it, and an rlib cannot, so `["cdylib", "lib"]` made
# `lto = "fat"` below a silent no-op. Dropping the rlib lets LTO run; see
# `src/lib.rs` for how the `tests/` suite is compiled instead.
crate-type = ["cdylib"]

[features]
# Mirrors the Anchor variant: lets a caller link this in as a plain library
# without pulling a second entrypoint into the binary.
no-entrypoint = []

[dependencies]
pinocchio = "0.11.2"
pinocchio-pubkey = "0.3.0"
pinocchio-system = "0.6.1"
solana-address = { version = "2.7", features = ["syscalls"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"

[dev-dependencies]
anchor-lang = "0.31.1"
bs58 = "0.5.1"
# Linked so the conformance tests can compare against the real thing rather
# than against transcribed constants. `no-entrypoint` keeps its entrypoint and
# allocator out of the test binary.
factory = { path = "../../programs/factory", features = ["no-entrypoint"] }
series = { path = "../../programs/series", features = ["no-entrypoint"] }
oracle-adapter = { path = "../../programs/oracle-adapter", features = ["no-entrypoint"] }
common = { path = "../../common" }
proptest = "1.11.0"
sha2 = "0.11.0"
# `Address::find_program_address` is a syscall on the `solana` target and free
# there. Off-target it needs curve25519, which is wanted only for host tests --
# putting dalek in the normal dependency set would add weight to the artifact
# whose size is the entire point of this crate.
solana-address = { version = "2.7", features = ["curve25519"] }
